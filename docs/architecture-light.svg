<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Architecture: the Hayward pool panel connects over RS-485 to either an AquaConnect box or a Pi Zero pad bridge. Exactly one of those connects to the Python sidecar, which serves both the Homebridge plugin and the web cockpit. The pad bridge, sidecar and plugin are filled, marking them as pieces you install and run yourself.">
